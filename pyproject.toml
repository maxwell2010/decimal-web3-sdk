[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decimal-web3-sdk"
version = "0.1.0"
description = "Modular Decimal Web3 SDK for custom Decimal nodes and APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MintCandy / Decimal SDK Team" }]
keywords = ["decimal", "web3", "sdk", "evm", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "aiohttp>=3.9",
    "web3>=6.0",
    "eth-account>=0.10",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://mintcandy.ru/"
Repository = "https://github.com/maxwell2010/mintcandy-python-sdk"
Issues = "https://github.com/maxwell2010/mintcandy-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "twine>=5.0",
    "mypy>=1.8",
]

[project.scripts]
decimal-sdk = "decimal_web3_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decimal_web3_sdk = ["abi/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: opt-in tests that touch live Decimal nodes",
]
