[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decimal-web3-sdk"
dynamic = ["version"]
description = "Decimal EVM SDK: exact amounts, transactions, tokens, staking and NFTs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "MintCandy / Decimal SDK Team" }]
keywords = ["decimal", "web3", "sdk", "evm", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "aiohttp>=3.12,<4",
    "certifi>=2024.7.4",
    "web3>=7.13,<8",
    "eth-account>=0.13.7,<0.14",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://mintcandy.ru/"
Repository = "https://github.com/maxwell2010/decimal-web3-sdk"
Issues = "https://github.com/maxwell2010/decimal-web3-sdk/issues"
Documentation = "https://github.com/maxwell2010/decimal-web3-sdk/tree/main/docs"
Changelog = "https://github.com/maxwell2010/decimal-web3-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "cryptography>=43",
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "twine>=5.0",
    "mypy>=1.8",
]

[project.scripts]
decimal-sdk = "decimal_web3_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decimal_web3_sdk*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "decimal_web3_sdk._version.__version__"}

[tool.setuptools.package-data]
decimal_web3_sdk = ["abi/*.md", "abi/*.json", "profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: opt-in tests that touch live Decimal nodes",
]
